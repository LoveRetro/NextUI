# Per-controller button maps for external (Bluetooth/USB) pads on h700.
#
# NextUI reads this at startup and whenever a controller is plugged in, so edit
# and reconnect the pad; no rebuild needed. A copy at
#   /mnt/SDCARD/.userdata/h700/controllers.cfg
# is read first and wins over this file.
#
# Each [section] names a controller. It matches when the section name appears
# anywhere in the controller's SDL name (case-insensitive). The name is logged
# when the pad connects ("Joystick added at index N: <name>").
#
# Once a controller matches, only the entries listed for it are used:
#   button.N = TARGET   SDL button number N acts as TARGET. Buttons not listed
#                       are ignored.
#   axis.N   = TARGET   SDL axis number N acts as TARGET. Axes not listed fall
#                       back to the platform defaults.
#
# Button targets: UP DOWN LEFT RIGHT A B X Y START SELECT MENU L1 R1 L2 R2
#                 L3 R3 L4 R4 PLUS MINUS POWER, or NONE to ignore it
# Axis targets:   any button target (pressed while the axis is above zero, for
#                 analog triggers), or LX LY RX RY for the sticks, or NONE
#
# D-pad hats are handled automatically and need no entry.
#
# Use the minput app to find the numbers: its RAW line shows "JOY N" for
# buttons and "AXIS N" for axes.

[8Bitdo SN30 Pro]
button.0 = MENU      # Home
button.1 = B
button.2 = A
button.3 = Y
button.4 = X
button.5 = L1
button.6 = R1
button.7 = SELECT
button.8 = START
# L3/R3 (stick clicks) not measured yet; add button.N = L3 / R3 if wanted

axis.2 = L2          # analog triggers
axis.5 = R2
axis.0 = LX
axis.1 = LY
axis.3 = RX          # not measured; assumed to follow the usual layout
axis.4 = RY

# Same as the SN30 Pro except the face buttons are numbered in order
# (A=1 B=2 X=3 Y=4). "Battler" is a guess at the SDL name: adjust it if the
# name logged when the pad connects doesn't contain it.
[Xbox Wireless Controller]
button.0 = MENU      # Home
button.1 = A
button.2 = B
button.3 = X
button.4 = Y
button.5 = L1
button.6 = R1
button.7 = SELECT
button.8 = START

axis.2 = L2          # analog triggers
axis.5 = R2
axis.0 = LX
axis.1 = LY
axis.3 = RX          # not measured; assumed to follow the usual layout
axis.4 = RY
